# Function: build-index — scans test-case front-matter into index files (backs OQL search & correlation).
name: build-index
on:
  push:
    branches: [main]
    paths:
      - "tests/automated-full-regression-ui/**"
      - ".onetest/fields.yml"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build automated test index
        run: |
          python3 onetest-tms/scripts/_index.py \
            --dir tests/automated-full-regression-ui \
            --out index_automated.json
          echo "Indexed $(jq '.cases | length' index_automated.json) cases"

      - name: Build short index for pipeline mapping
        run: |
          jq '{cases: [.cases[] | select(.automation_test_id | length > 0) | {id, automation_test_id}]}' index_automated.json > index_automated_short.json
          echo "Short index: $(wc -c < index_automated_short.json) bytes ($(jq '.cases | length' index_automated_short.json) cases with automation_test_id)"

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index_automated.json index_automated_short.json
          git diff --cached --quiet || git commit -m "chore: rebuild index_automated.json"
          git push
