# Function: build-index — scans test-case front-matter into index files (backs OQL search & correlation).
name: build-index
on:
  push:
    branches: [main]
    paths:
      - "tests/automated-full-regression-ui/**"
      - ".onetest/fields.yml"
      - "onetest-tms/scripts/_index.py"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
# Back-to-back pushes must not race each other's index commit.
concurrency:
  group: build-index
  cancel-in-progress: false
jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build automated test index
        run: |
          python3 onetest-tms/scripts/_index.py \
            --dir tests/automated-full-regression-ui \
            --out index_automated.json
          echo "Indexed $(jq '.cases | length' index_automated.json) cases"

      # Only cases with at least one non-blank automation_test_id; unchanged when no mapping changed.
      - name: Build short index for pipeline mapping
        run: |
          jq '{cases: [.cases[]
                | .automation_test_id = [(.automation_test_id // [])[] | strings | select(test("\\S"))]
                | select(.automation_test_id | length > 0)
                | {id, automation_test_id}]}' index_automated.json > index_automated_short.json
          echo "Short index: $(wc -c < index_automated_short.json) bytes ($(jq '.cases | length' index_automated_short.json) cases with automation_test_id)"

      - name: Build all-cases short index (id, priority, path)
        run: |
          jq '{cases: [.cases[] | {id, priority, path}]}' index_automated.json > index_automated_all_short.json
          echo "All-short index: $(wc -c < index_automated_all_short.json) bytes ($(jq '.cases | length' index_automated_all_short.json) cases)"

      # main requires a PR (repo ruleset "Default protect"), so the rebuilt index is pushed on a
      # throwaway branch and left as a PR for a human to merge.
      - name: Commit index if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index_automated.json index_automated_short.json index_automated_all_short.json
          if git diff --cached --quiet; then
            echo "Indexes unchanged"
            exit 0
          fi
          changed=$(git diff --cached --name-only | tr '\n' ' ')
          echo "Changed: $changed"
          branch="chore/build-index-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "chore: rebuild ${changed% }"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open index PR
        if: steps.commit.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh pr create --title "chore: rebuild index (${BRANCH})" \
            --body "Automated index rebuild from push to main. Please review and merge." \
            --base main --head "$BRANCH"
